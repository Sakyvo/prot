<!doctype html>
<html>
<head><base href="../"><meta charset="utf-8"><title>ui-test</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  function log(s) { console.log('[uitest] ' + s); }
  var failures = 0;
  function check(name, cond) { if (!cond) failures++; log((cond ? 'pass' : 'FAIL') + '  ' + name); }
  var mobile = matchMedia('(max-width: 760px)').matches;
  log('mode: ' + (mobile ? 'mobile' : 'desktop') + ' (innerWidth ' + window.innerWidth + ')');

  try {
    var mount = document.createElement('main');
    document.body.appendChild(mount);
    var app = ProtUI.mount(mount);
    var state = app.state;
    var near = function (a, b, tol) { return Math.abs(a - b) <= (tol || 1.5); };

    // ================= v2 regressions =================
    check('no site header in page shell', !document.querySelector('.site-head'));
    check('no "protection" wording', mount.textContent.indexOf('protection') === -1);
    check('no "resistance" wording', mount.textContent.indexOf('resistance') === -1);
    check('body background is #d4e0ec',
      getComputedStyle(document.body).backgroundColor === 'rgb(212, 224, 236)');

    var rows = mount.querySelectorAll('.slot-row');
    check('four slot rows', rows.length === 4);
    check('row order helmet->boots',
      rows[0].dataset.slot === 'helmet' && rows[3].dataset.slot === 'boots');

    var first = rows[0];
    check('trigger shows empty slot for none',
      /assets\/textures\/empty_armor_slot_helmet\.png$/.test(first.querySelector('.slot-trigger img').src));
    check('durability 0 for none', first.querySelector('.durability').textContent.trim() === '0');
    check('prot label text is "prot"', first.querySelector('.prot-label').textContent.trim() === 'prot');
    check('no flat material button row', mount.querySelectorAll('.mats').length === 0);

    // picker behaviour
    var pop = first.querySelector('.material-popover');
    check('popover starts hidden', !!pop && !pop.classList.contains('is-open'));
    first.querySelector('.slot-trigger').click();
    check('trigger click opens popover', pop.classList.contains('is-open'));
    check('popover has 6 options', pop.querySelectorAll('.mat-option').length === 6);
    document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('outside click closes popover', !pop.classList.contains('is-open'));
    first.querySelector('.slot-trigger').click();
    pop.querySelector('.mat-option[data-material="diamond"]').click();
    check('pick diamond closes popover', !pop.classList.contains('is-open'));
    check('durability 363 after diamond', first.querySelector('.durability').textContent.trim() === '363');
    check('state updated', state.slots.helmet.material === 'diamond');
    first.querySelector('.slot-trigger').click();
    pop.querySelector('.mat-option[data-material="none"]').click();
    check('durability back to 0', first.querySelector('.durability').textContent.trim() === '0');

    // resistance levels
    var resRow = mount.querySelector('.resistance-row');
    var levels = resRow.querySelectorAll('.res-level');
    check('six resistance levels', levels.length === 6);
    check('shield icon from assets',
      /assets\/textures\/effect_resistance\.png$/.test(resRow.querySelector('.res-icon').src));
    levels[3].click();
    check('level 3 sets resistance 3', state.resistance === 3);
    check('active class follows', levels[3].classList.contains('is-active'));
    levels[0].click();
    check('level 0 clears', state.resistance === 0 && !levels[3].classList.contains('is-active'));

    // results basics
    var results = mount.querySelector('.results');
    var redStat = results.querySelector('.stat.reduction');
    var takenStat = results.querySelector('.stat.taken');
    check('reduction stat label', redStat.querySelector('.stat-label').textContent.trim() === 'reduction');
    check('taken stat label', takenStat.querySelector('.stat-label').textContent.trim() === 'taken');
    check('reduction starts 0.00%', redStat.querySelector('.stat-value').textContent.trim() === '0.00%');

    var dmg = results.querySelector('.damage-input');
    var dmgVal = results.querySelector('.damage-value');
    var heartVal = results.querySelector('.heart-value');
    check('damage defaults 0.00', dmgVal.textContent.trim() === '0.00');
    check('hearts default 0.00', heartVal.textContent.trim() === '0.00');
    check('heart icon present',
      /assets\/textures\/heart\.png$/.test(results.querySelector('.heart-icon').src));

    ['helmet', 'chestplate', 'leggings', 'boots'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="diamond"]').click();
    });
    check('full diamond reduction 80.00%',
      redStat.querySelector('.stat-value').textContent.trim() === '80.00%');
    dmg.value = '10';
    dmg.dispatchEvent(new Event('input', { bubbles: true }));
    check('damage 10 @ 80% -> 2.00', dmgVal.textContent.trim() === '2.00');
    check('2.00 damage -> 1.00 hearts', heartVal.textContent.trim() === '1.00');

    var helmProt = mount.querySelector('[data-slot="helmet"] .prot-input');
    helmProt.value = '21';
    helmProt.dispatchEvent(new Event('input', { bubbles: true }));
    check('epf capped badge visible past 20', results.querySelector('.epf-capped').hidden === false);
    helmProt.value = '0';
    helmProt.dispatchEvent(new Event('input', { bubbles: true }));
    check('badge hidden again', results.querySelector('.epf-capped').hidden === true);

    // modal plumbing
    var modal = mount.querySelector('.detail-modal');
    check('detail modal exists', !!modal);
    check('modal has svg close', !!modal.querySelector('svg.modal-close'));
    check('modal starts closed', !modal.classList.contains('is-open'));
    check('modal has three lines', modal.querySelectorAll('.line').length === 3);
    if (mobile) {
      redStat.querySelector('.stat-label').click();
      check('label opens modal on mobile', modal.classList.contains('is-open'));
      modal.querySelector('svg.modal-close').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      check('svg close works', !modal.classList.contains('is-open'));
      redStat.querySelector('.stat-label').click();
      modal.querySelector('.modal-backdrop').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      check('backdrop closes', !modal.classList.contains('is-open'));
    } else {
      redStat.querySelector('.stat-label').click();
      check('label does not open modal on desktop', !modal.classList.contains('is-open'));
    }

    // ================= v3: centered frame + divider =================
    var mainRect = mount.getBoundingClientRect();
    var leftGap = mainRect.left;
    var rightGap = window.innerWidth - mainRect.right;
    check('desktop content centered (left ' + leftGap.toFixed(0) + ' / right ' + rightGap.toFixed(0) + ')',
      mobile || (leftGap > 8 && near(leftGap, rightGap, 3)));

    var resCs = getComputedStyle(results);
    check('results has 2px left divider (desktop only, mobile ' + mobile + ')',
      mobile ? parseFloat(resCs.borderLeftWidth) === 0 : parseFloat(resCs.borderLeftWidth) === 2);
    check('divider is black', mobile || resCs.borderLeftColor === 'rgb(16, 20, 24)');

    var oddBorders = [];
    mount.querySelectorAll('*').forEach(function (n) {
      if (n === results || n.classList.contains('mobile-bar') ||
          n.closest('.detail-modal')) return;
      var cs = getComputedStyle(n);
      if (['borderTopWidth', 'borderRightWidth', 'borderBottomWidth'].some(function (k) {
        return parseFloat(cs[k]) > 0;
      }) || parseFloat(cs.borderLeftWidth) > 0) oddBorders.push(n.className || n.tagName);
    });
    check('no other borders (found: ' + oddBorders.slice(0, 4).join('|') + ')', oddBorders.length === 0);
    check('divider stops at content bottom (results ' + results.getBoundingClientRect().height.toFixed(0) +
      ' < main ' + mainRect.height.toFixed(0) + ')',
      results.getBoundingClientRect().height < mainRect.height - 40);

    // ================= v3: alignment =================
    var rv = redStat.querySelector('.stat-value').getBoundingClientRect();
    var tv = takenStat.querySelector('.stat-value').getBoundingClientRect();
    var rl = redStat.querySelector('.stat-label').getBoundingClientRect();
    var tl = takenStat.querySelector('.stat-label').getBoundingClientRect();
    check('reduction value right-aligned with taken value', near(rv.right, tv.right));
    check('reduction label x == taken label x', near(rl.left, tl.left));

    var lineVals = results.querySelectorAll('.breakdown .line-value');
    check('three breakdown values', lineVals.length === 3);
    var vx = Array.prototype.map.call(lineVals, function (n) { return n.getBoundingClientRect().left; });
    check('breakdown values share x (' + vx.map(function (v) { return v.toFixed(0); }).join(',') + ')',
      near(vx[0], vx[1]) && near(vx[1], vx[2]));
    var lineLabels = results.querySelectorAll('.breakdown .line-label');
    check('breakdown labels are armor / prot / res',
      lineLabels[0].textContent.trim() === 'armor' &&
      lineLabels[1].textContent.trim() === 'prot' &&
      lineLabels[2].textContent.trim() === 'res');

    // control row baselines
    var protLabel = first.querySelector('.prot-label').getBoundingClientRect();
    var lvl0 = levels[0].getBoundingClientRect();
    var lvl5 = levels[5].getBoundingClientRect();
    var plusBtn = first.querySelector('.prot-inc').getBoundingClientRect();
    check('resistance 0 aligns with prot label (prot ' + protLabel.left.toFixed(0) +
      ' / level0 ' + lvl0.left.toFixed(0) + ')', near(protLabel.left, lvl0.left, 2));
    check('resistance 5 aligns with + button (plus ' + plusBtn.right.toFixed(0) +
      ' / level5 ' + lvl5.right.toFixed(0) + ')', near(plusBtn.right, lvl5.right, 2));

    var shield = resRow.querySelector('.res-icon').getBoundingClientRect();
    var triggerBox = first.querySelector('.slot-trigger').getBoundingClientRect();
    check('shield sized like armor icon (' + shield.height.toFixed(0) + ' vs ' + triggerBox.height.toFixed(0) + ')',
      near(shield.height, triggerBox.height, 2));

    var protInput = first.querySelector('.prot-input');
    protInput.value = '32767';
    protInput.dispatchEvent(new Event('input', { bubbles: true }));
    check('input fits 32767 (scroll ' + protInput.scrollWidth + ' <= client ' + protInput.clientWidth + ')',
      protInput.scrollWidth <= protInput.clientWidth);
    protInput.value = '0';
    protInput.dispatchEvent(new Event('input', { bubbles: true }));

    // ================= v3: popover placement + damage order =================
    first.querySelector('.slot-trigger').click();
    var popRect = pop.getBoundingClientRect();
    var trigRect = first.querySelector('.slot-trigger').getBoundingClientRect();
    var protRect = first.querySelector('.prot').getBoundingClientRect();
    check('popover sits to the right of the trigger (' + popRect.left.toFixed(0) +
      ' >= ' + trigRect.right.toFixed(0) + ')', popRect.left >= trigRect.right - 2);
    check('popover covers the prot control', popRect.left < protRect.right && popRect.right > protRect.left);
    var rowH = first.getBoundingClientRect().height;
    pop.querySelector('.mat-option[data-material="none"]').click();
    check('row height unchanged by popover', near(first.getBoundingClientRect().height, rowH, 1));

    var out = results.querySelector('.damage-out');
    var order = Array.prototype.map.call(out.children, function (n) { return n.className; });
    check('damage order: value -> heart value -> heart icon (' + order.join(' ') + ')',
      /damage-value/.test(order[0]) && /damage-equals/.test(order[1]) &&
      /heart-value/.test(order[2]) && /heart-icon/.test(order[3]));

    // ================= v4: palette, spacing, equals, persistence, reset =================
    check('prot label is enchanted purple',
      getComputedStyle(first.querySelector('.prot-label')).color === 'rgb(138, 92, 245)');
    check('durability is muted green',
      getComputedStyle(first.querySelector('.durability')).color === 'rgb(74, 143, 82)');
    check('reduction value is green',
      getComputedStyle(redStat.querySelector('.stat-value')).color === 'rgb(47, 125, 58)');
    check('reduction label is dark green',
      getComputedStyle(redStat.querySelector('.stat-label')).color === 'rgb(26, 84, 36)');
    check('taken value is red',
      getComputedStyle(takenStat.querySelector('.stat-value')).color === 'rgb(178, 58, 58)');
    check('taken label is dark red',
      getComputedStyle(takenStat.querySelector('.stat-label')).color === 'rgb(122, 32, 32)');

    var equals = results.querySelector('.damage-equals');
    check('equals sign between damage and hearts', !!equals && equals.textContent.trim() === '=');

    var gapLeft = results.getBoundingClientRect().left - mount.querySelector('.controls').getBoundingClientRect().right;
    var gapRight = parseFloat(resCs.paddingLeft);
    check('divider neighbours equal (' + gapLeft.toFixed(0) + ' vs ' + gapRight.toFixed(0) + ')',
      mobile || near(gapLeft, gapRight, 2));

    // transitions sped up
    var popTransition = getComputedStyle(pop).transitionDuration;
    check('popover transition <= 100ms (' + popTransition + ')',
      parseFloat(popTransition) <= 0.1);
    var modalTransition = getComputedStyle(modal).transitionDuration;
    check('modal transition <= 160ms (' + modalTransition + ')',
      parseFloat(modalTransition) <= 0.16);

    // reset control at the right end of the resistance row
    var resetBtn = resRow.querySelector('.reset-button');
    check('reset button exists with svg', !!resetBtn && !!resetBtn.querySelector('svg'));
    var resetRect = resetBtn.getBoundingClientRect();
    var levelsRect = levels[5].getBoundingClientRect();
    check('reset sits to the right of the levels', resetRect.left >= levelsRect.right - 2);

    // persistence: state survives a fresh mount
    ['helmet', 'chestplate'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="iron"]').click();
    });
    mount.querySelector('[data-slot="helmet"] .prot-input').value = '3';
    mount.querySelector('[data-slot="helmet"] .prot-input').dispatchEvent(new Event('input', { bubbles: true }));
    levels[2].click();
    dmg.value = '12';
    dmg.dispatchEvent(new Event('input', { bubbles: true }));

    var stored = window.localStorage.getItem('prot.state');
    check('state written to localStorage', !!stored && /iron/.test(stored) && /"resistance":2/.test(stored));

    var mount2 = document.createElement('main');
    document.body.appendChild(mount2);
    var app2 = ProtUI.mount(mount2);
    check('restored iron helmet', app2.state.slots.helmet.material === 'iron');
    check('restored prot 3', app2.state.slots.helmet.prot === 3);
    check('restored resistance 2', app2.state.resistance === 2);
    check('restored damage input', mount2.querySelector('.damage-input').value === '12');
    mount2.remove();

    // reset: confirm modal, then wipe state + storage
    resetBtn.click();
    var confirmModal = mount.querySelector('.reset-modal');
    check('reset opens confirm modal', !!confirmModal && confirmModal.classList.contains('is-open'));
    confirmModal.querySelector('.reset-cancel').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('cancel keeps state', app.state.slots.helmet.material === 'iron' &&
      !confirmModal.classList.contains('is-open'));
    resetBtn.click();
    confirmModal.querySelector('.reset-confirm').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('confirm clears equipment', app.state.slots.helmet.material === 'none' &&
      app.state.slots.chestplate.material === 'none');
    check('confirm clears prot and resistance', app.state.slots.helmet.prot === 0 && app.state.resistance === 0);
    check('confirm clears damage input', mount.querySelector('.damage-input').value === '');
    var afterReset = window.localStorage.getItem('prot.state');
    check('confirm clears storage (' + afterReset + ')',
      !!afterReset && !/iron/.test(afterReset) && /"prot":0/.test(afterReset) &&
      /"resistance":0/.test(afterReset));
    check('reset modal closed after confirm', !confirmModal.classList.contains('is-open'));

    // vertical compression
    var controlsGap = parseFloat(getComputedStyle(mount.querySelector('.controls')).rowGap);
    check('control rows tightly packed (' + controlsGap + 'px)',
      mobile ? controlsGap <= 26 : controlsGap <= 30);
    var resGap = parseFloat(getComputedStyle(resRow).marginTop) || controlsGap;
    check('resistance row separated from boots by a larger gap (' + resGap + ' vs ' + controlsGap + ')',
      resGap > controlsGap);
    if (mobile) {
      var bar = mount.querySelector('.mobile-bar');
      check('mobile footer has a top divider', parseFloat(getComputedStyle(bar).borderTopWidth) >= 2);
      check('mobile footer is not sticky', getComputedStyle(bar).position !== 'fixed');
      check('one screen fits empty config (' + mount.getBoundingClientRect().height.toFixed(0) + 'px)',
        mount.getBoundingClientRect().height <= 700);
    }

    // narrow-viewport popover wraps rather than overflowing
    {
      var probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:0;top:0;width:300px';
      var clone = first.cloneNode(true);
      probe.appendChild(clone);
      document.body.appendChild(probe);
      var cpop = clone.querySelector('.material-popover');
      cpop.classList.add('is-open');
      check('popover wraps within narrow container',
        cpop.getBoundingClientRect().width <= 300);
      document.body.removeChild(probe);
    }
  } catch (e) {
    log('FAIL  exception: ' + e.message + '\n' + (e.stack || ''));
    failures++;
  }
  log(failures === 0 ? 'all green' : failures + ' failing');
})();
</script>
</body>
</html>
