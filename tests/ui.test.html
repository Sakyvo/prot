<!doctype html>
<html>
<head><base href="../"><meta charset="utf-8"><title>ui-test</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var lines = [];
  function log(s) { lines.push(s); console.log('[uitest] ' + s); }
  var failures = 0;
  function check(name, cond) { if (!cond) failures++; log((cond ? 'pass' : 'FAIL') + '  ' + name); }
  var mobile = matchMedia('(max-width: 760px)').matches;
  log('mode: ' + (mobile ? 'mobile' : 'desktop') + ' (innerWidth ' + window.innerWidth + ')');

  try {
    var mount = document.createElement('main');
    document.body.appendChild(mount);
    var app = ProtUI.mount(mount);
    var state = app.state;
    var near = function (a, b, tol) { return Math.abs(a - b) <= (tol || 1.5); };

    // ================= v2 regressions =================
    check('no site header in page shell', !document.querySelector('.site-head'));
    check('no "protection" wording', mount.textContent.indexOf('protection') === -1);
    check('no "resistance" wording', mount.textContent.indexOf('resistance') === -1);
    check('body background is #d4e0ec',
      getComputedStyle(document.body).backgroundColor === 'rgb(212, 224, 236)');

    var rows = mount.querySelectorAll('.slot-row');
    check('four slot rows', rows.length === 4);
    check('row order helmet->boots',
      rows[0].dataset.slot === 'helmet' && rows[3].dataset.slot === 'boots');

    var first = rows[0];
    check('trigger shows empty slot for none',
      /assets\/textures\/empty_armor_slot_helmet\.png$/.test(first.querySelector('.slot-trigger img').src));
    check('durability 0 for none', first.querySelector('.durability').textContent.trim() === '0');
    check('prot label text is "prot"', first.querySelector('.prot-label').textContent.trim() === 'prot');
    check('no flat material button row', mount.querySelectorAll('.mats').length === 0);

    // picker behaviour
    var pop = first.querySelector('.material-popover');
    check('popover starts hidden', !!pop && !pop.classList.contains('is-open'));
    first.querySelector('.slot-trigger').click();
    check('trigger click opens popover', pop.classList.contains('is-open'));
    check('popover has 6 options', pop.querySelectorAll('.mat-option').length === 6);
    document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('outside click closes popover', !pop.classList.contains('is-open'));
    first.querySelector('.slot-trigger').click();
    pop.querySelector('.mat-option[data-material="diamond"]').click();
    check('pick diamond closes popover', !pop.classList.contains('is-open'));
    check('durability 363 after diamond', first.querySelector('.durability').textContent.trim() === '363');
    check('state updated', state.slots.helmet.material === 'diamond');
    first.querySelector('.slot-trigger').click();
    pop.querySelector('.mat-option[data-material="none"]').click();
    check('durability back to 0', first.querySelector('.durability').textContent.trim() === '0');

    // resistance levels
    var resRow = mount.querySelector('.resistance-row');
    var levels = resRow.querySelectorAll('.res-level');
    check('six resistance levels', levels.length === 6);
    check('shield icon from assets',
      /assets\/textures\/effect_resistance\.png$/.test(resRow.querySelector('.res-icon').src));
    levels[3].click();
    check('level 3 sets resistance 3', state.resistance === 3);
    check('active class follows', levels[3].classList.contains('is-active'));
    levels[0].click();
    check('level 0 clears', state.resistance === 0 && !levels[3].classList.contains('is-active'));

    // results basics
    var results = mount.querySelector('.results');
    var redStat = results.querySelector('.stat.reduction');
    var takenStat = results.querySelector('.stat.taken');
    check('reduction stat label', redStat.querySelector('.stat-label').textContent.trim() === 'reduction');
    check('taken stat label', takenStat.querySelector('.stat-label').textContent.trim() === 'taken');
    check('reduction starts 0.00%', redStat.querySelector('.stat-value').textContent.trim() === '0.00%');

    var damageRowEl = results.querySelector('.damage-row');
    var dmgVal = results.querySelector('.damage-value');
    var heartVal = results.querySelector('.heart-value');
    check('bare hand dmg is 1.00', results.querySelector('.dmg-value').textContent.trim() === '1.00');
    check('bare hand through 0% -> 1.00', dmgVal.textContent.trim() === '1.00');
    check('1.00 taken -> 0.50 hearts', heartVal.textContent.trim() === '0.50');
    check('results carry no editable control', results.querySelectorAll('input, select, textarea').length === 0);
    check('results carry the ccl tag', results.querySelector('.dmg-tag').textContent.trim() === 'ccl');
    check('heart icon present',
      /assets\/textures\/heart\.png$/.test(results.querySelector('.heart-icon').src));

    ['helmet', 'chestplate', 'leggings', 'boots'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="diamond"]').click();
    });
    check('full diamond reduction 80.00%',
      redStat.querySelector('.stat-value').textContent.trim() === '80.00%');
    check('bare hand through 80% -> 0.20', dmgVal.textContent.trim() === '0.20');
    check('0.20 taken -> 0.10 hearts', heartVal.textContent.trim() === '0.10');

    var helmProt = mount.querySelector('[data-slot="helmet"] .prot-input');
    helmProt.value = '21';
    helmProt.dispatchEvent(new Event('input', { bubbles: true }));
    check('epf capped badge visible past 25 raw', results.querySelector('.epf-capped').hidden === false);
    helmProt.value = '0';
    helmProt.dispatchEvent(new Event('input', { bubbles: true }));
    check('badge hidden again', results.querySelector('.epf-capped').hidden === true);

    // full diamond + protection IV: raw epf = 4 * floor(22/3*0.75) = 20 (under the pre-cap of 25)
    // roll expectation is 3..4..5 mean 4 -> 60% protection -> taken 8%
    ['helmet', 'chestplate', 'leggings', 'boots'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="diamond"]').click();
      var pi = row.querySelector('.prot-input');
      pi.value = '4';
      pi.dispatchEvent(new Event('input', { bubbles: true }));
    });
    check('prot4 x4: badge stays hidden (raw 20 <= 25)',
      results.querySelector('.epf-capped').hidden === true);
    check('prot4 x4: taken 8.00%',
      takenStat.querySelector('.stat-value').textContent.trim() === '8.00%');
    check('prot4 x4: breakdown prot 60.00%',
      results.querySelectorAll('.breakdown .line-value')[1].textContent.trim() === '60.00%');

    var badge = results.querySelector('.epf-capped');
    check('badge wording avoids protection/resistance',
      badge.textContent.indexOf('protection') === -1 && badge.textContent.indexOf('resistance') === -1);

    // the detail modal is gone: the full results block always sits on the page
    check('no detail modal', !mount.querySelector('.detail-modal'));

    // ================= v6: two standing panels + full-width results =================
    check('no tab strip', !mount.querySelector('.tabs'));
    var panels = mount.querySelector('.panels');
    check('panel row exists', !!panels);
    var defPanel = mount.querySelector('.panel[data-panel="def"]');
    var dmgPanel = mount.querySelector('.panel[data-panel="dmg"]');
    check('two panels', !!defPanel && !!dmgPanel);
    check('both panels stay visible',
      getComputedStyle(defPanel).display !== 'none' && getComputedStyle(dmgPanel).display !== 'none' &&
      !defPanel.hidden && !dmgPanel.hidden);
    check('panels are titled def / dmg',
      defPanel.querySelector('.panel-title').textContent.trim() === 'def' &&
      dmgPanel.querySelector('.panel-title').textContent.trim() === 'dmg');
    check('input works without touching a tab',
      defPanel.querySelector('.slot-row') !== null && dmgPanel.querySelector('.weapon-input') !== null);

    var divider = mount.querySelector('.divider');
    check('divider exists', !!divider);
    check('divider sits below the input panel',
      divider.getBoundingClientRect().top >= defPanel.getBoundingClientRect().bottom - 1);
    check('divider sits above the results',
      divider.getBoundingClientRect().top <= results.getBoundingClientRect().top + 1);
    check('divider spans the content frame (' + divider.getBoundingClientRect().width.toFixed(0) +
      ' vs ' + results.getBoundingClientRect().width.toFixed(0) + ')',
      near(divider.getBoundingClientRect().width, results.getBoundingClientRect().width, 2) &&
      near(results.getBoundingClientRect().width, panels.getBoundingClientRect().width, 2));
    check('divider is 2px black',
      getComputedStyle(divider).borderTopColor === 'rgb(16, 20, 24)');
    check('results has no left divider', parseFloat(getComputedStyle(results).borderLeftWidth) === 0);
    check('results span both panel columns (' + results.getBoundingClientRect().width.toFixed(0) +
      ' vs ' + panels.getBoundingClientRect().width.toFixed(0) + ')',
      near(results.getBoundingClientRect().width, panels.getBoundingClientRect().width, 2));

    var bar = mount.querySelector('.mobile-bar');
    if (mobile) {
      check('panels stack vertically (def above dmg)', near(defPanel.getBoundingClientRect().left,
        dmgPanel.getBoundingClientRect().left, 2) &&
        defPanel.getBoundingClientRect().bottom <= dmgPanel.getBoundingClientRect().top + 1);
      check('mobile bar is fixed', getComputedStyle(bar).position === 'fixed');
      check('mobile bar pinned to viewport bottom (' + bar.getBoundingClientRect().bottom.toFixed(0) +
        ' vs ' + document.documentElement.clientHeight + ')',
        near(bar.getBoundingClientRect().bottom, document.documentElement.clientHeight, 2));
      check('mobile results show reduction/taken',
        getComputedStyle(results.querySelector('.stat.reduction')).display !== 'none' &&
        getComputedStyle(results.querySelector('.stat.taken')).display !== 'none');
      check('mobile results show breakdown',
        getComputedStyle(results.querySelector('.breakdown')).display !== 'none');
      window.scrollTo(0, 400);
      check('mobile bar still pinned after scrolling (' + bar.getBoundingClientRect().bottom.toFixed(0) +
        ' vs ' + document.documentElement.clientHeight + ')',
        near(bar.getBoundingClientRect().bottom, document.documentElement.clientHeight, 2));
      window.scrollTo(0, 0);
      check('page leaves room for the fixed bar',
        parseFloat(getComputedStyle(document.body).paddingBottom) > 0 ||
        parseFloat(getComputedStyle(mount).paddingBottom) >= bar.getBoundingClientRect().height);
    } else {
      check('panels sit side by side (def left, dmg right)',
        near(defPanel.getBoundingClientRect().top, dmgPanel.getBoundingClientRect().top, 2) &&
        defPanel.getBoundingClientRect().right <= dmgPanel.getBoundingClientRect().left + 1);
      check('desktop hides the mobile bar', getComputedStyle(bar).display === 'none');
    }

    // ================= v6.1: damage panel =================
    var dmgRows = dmgPanel.querySelectorAll('.dmg-row');
    check('dmg panel has six attack rows plus the manual row', dmgRows.length === 7);
    var weaponInput = dmgPanel.querySelector('.weapon-input');
    var sharpInput = dmgPanel.querySelector('.sharp-input');
    check('fist row is read-only text "1"',
      dmgPanel.querySelector('[data-field="fist"] .fist-value').textContent.trim() === '1' &&
      !dmgPanel.querySelector('[data-field="fist"] input'));
    check('weapon input exists', !!dmgPanel.querySelector('.weapon-input'));
    check('sharpness stepper exists', !!dmgPanel.querySelector('.sharp-input') &&
      !!dmgPanel.querySelector('.sharp-dec') && !!dmgPanel.querySelector('.sharp-inc'));

    var strIcon = dmgPanel.querySelector('.strength-icon');
    var weakIcon = dmgPanel.querySelector('.weakness-icon');
    check('strength icon from site assets',
      !!strIcon && /assets\/textures\/effect_strength\.png$/.test(strIcon.src));
    check('weakness icon from site assets',
      !!weakIcon && /assets\/textures\/effect_weakness\.png$/.test(weakIcon.src));
    check('strength icon is named', !!strIcon && strIcon.title === 'strength');
    check('weakness icon is named', !!weakIcon && weakIcon.title === 'weakness');

    var crowded = [];
    dmgPanel.querySelectorAll('.dmg-row').forEach(function (row) {
      var label = row.firstElementChild;
      var control = label && label.nextElementSibling;
      if (label.tagName !== 'IMG' && label.scrollWidth > label.clientWidth + 0.5) {
        crowded.push(row.dataset.field + ':text');
      }
      if (control && label.getBoundingClientRect().right > control.getBoundingClientRect().left + 0.5) {
        crowded.push(row.dataset.field + ':box');
      }
    });
    check('dmg labels stay clear of their controls (' + crowded.join(',') + ')', crowded.length === 0);

    // mode toggle: ccl computes, mnl takes the number as the pre-armor damage
    var modeBtns = dmgPanel.querySelectorAll('.mode');
    check('two damage modes', modeBtns.length === 2 &&
      modeBtns[0].dataset.mode === 'ccl' && modeBtns[1].dataset.mode === 'mnl');
    check('ccl is the default mode', modeBtns[0].classList.contains('is-active'));
    var manualRow = dmgPanel.querySelector('[data-field="manual"]');
    var cclRow = dmgPanel.querySelector('[data-field="weapon"]');
    check('manual row hidden in ccl', !!manualRow && manualRow.hidden === true &&
      getComputedStyle(manualRow).display === 'none');
    check('ccl rows shown in ccl', cclRow.hidden === false &&
      getComputedStyle(cclRow).display !== 'none');

    weaponInput.value = '6';
    weaponInput.dispatchEvent(new Event('input', { bubbles: true }));
    sharpInput.value = '5';
    sharpInput.dispatchEvent(new Event('input', { bubbles: true }));
    var cclDmg = results.querySelector('.dmg-value').textContent.trim();
    var cclTaken = dmgVal.textContent.trim();

    modeBtns[1].click();
    var manualInput = dmgPanel.querySelector('.manual-input');
    check('manual row shown in mnl', manualRow.hidden === false &&
      getComputedStyle(manualRow).display !== 'none');
    check('ccl rows hidden in mnl', cclRow.hidden === true &&
      getComputedStyle(cclRow).display === 'none');
    check('results tag follows the mode', results.querySelector('.dmg-tag').textContent.trim() === 'mnl');

    manualInput.value = cclDmg;
    manualInput.dispatchEvent(new Event('input', { bubbles: true }));
    check('mnl uses the number as given (no weapon/sharpness stacking)',
      results.querySelector('.dmg-value').textContent.trim() === cclDmg);
    check('same number through mnl gives the same taken (' + dmgVal.textContent.trim() +
      ' vs ' + cclTaken + ')', dmgVal.textContent.trim() === cclTaken);

    modeBtns[0].click();
    check('ccl values survive the round trip',
      weaponInput.value === '6' && sharpInput.value === '5');
    check('ccl tag returns', results.querySelector('.dmg-tag').textContent.trim() === 'ccl');
    modeBtns[1].click();
    check('manual value survives the round trip', manualInput.value === cclDmg);
    modeBtns[0].click();
    weaponInput.value = '';
    weaponInput.dispatchEvent(new Event('input', { bubbles: true }));
    sharpInput.value = '0';
    sharpInput.dispatchEvent(new Event('input', { bubbles: true }));

    var fistBox = dmgPanel.querySelector('.fist-value').getBoundingClientRect();
    var weaponBox = weaponInput.getBoundingClientRect();
    var stepperBox = dmgPanel.querySelector('.dmg-stepper').getBoundingClientRect();
    check('fist / weapon / stepper share one width (' + fistBox.width.toFixed(0) + ' / ' +
      weaponBox.width.toFixed(0) + ' / ' + stepperBox.width.toFixed(0) + ')',
      near(fistBox.width, weaponBox.width, 1) && near(weaponBox.width, stepperBox.width, 1));
    check('fist and weapon end on the same edge',
      near(fistBox.right, stepperBox.right, 1) && near(weaponBox.right, stepperBox.right, 1));
    check('weapon number is centred', getComputedStyle(weaponInput).textAlign === 'center');

    var critBox = dmgPanel.querySelector('.crit-input');
    check('crit is a checkbox', !!critBox && critBox.type === 'checkbox');
    check('crit unchecked by default', critBox.checked === false);

    // steppers leave the 0..5 resistance range behind
    var strInput = dmgPanel.querySelector('.strength-input');
    var strInc = dmgPanel.querySelector('.strength-inc');
    var strDec = dmgPanel.querySelector('.strength-dec');
    for (var step = 0; step < 6; step++) strInc.click();
    check('strength steps past 5 (' + strInput.value + ')', strInput.value === '6');
    strInput.value = '32767';
    strInput.dispatchEvent(new Event('input', { bubbles: true }));
    strInc.click();
    check('strength capped at 32767', strInput.value === '32767');
    strDec.click();
    check('strength steps down to 32766', strInput.value === '32766');
    strInput.value = '0';
    strInput.dispatchEvent(new Event('input', { bubbles: true }));
    strDec.click();
    check('strength floor is 0', strInput.value === '0');

    // results read the computed damage and follow input changes live
    ['helmet', 'chestplate', 'leggings', 'boots'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="diamond"]').click();
      var pi = row.querySelector('.prot-input');
      pi.value = '0';
      pi.dispatchEvent(new Event('input', { bubbles: true }));
    });
    weaponInput.value = '6';
    weaponInput.dispatchEvent(new Event('input', { bubbles: true }));
    check('diamond sword dmg 7.00 while the dmg tab is closed',
      results.querySelector('.dmg-value').textContent.trim() === '7.00');
    check('7.00 through 80% -> 1.40', dmgVal.textContent.trim() === '1.40');
    check('1.40 taken -> 0.70 hearts', heartVal.textContent.trim() === '0.70');

    sharpInput.value = '5';
    sharpInput.dispatchEvent(new Event('input', { bubbles: true }));
    check('sharpness V adds 6.25', results.querySelector('.dmg-value').textContent.trim() === '13.25');
    critBox.click();
    check('crit multiplies the attribute only',
      results.querySelector('.dmg-value').textContent.trim() === '16.75');
    critBox.click();
    sharpInput.value = '0';
    sharpInput.dispatchEvent(new Event('input', { bubbles: true }));

    // clearing the inputs falls back to the bare hand
    weaponInput.value = '';
    weaponInput.dispatchEvent(new Event('input', { bubbles: true }));
    check('empty weapon falls back to the bare hand',
      results.querySelector('.dmg-value').textContent.trim() === '1.00');
    ['helmet', 'chestplate', 'leggings', 'boots'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="none"]').click();
    });

    // ================= v3: centered frame =================
    var mainRect = mount.getBoundingClientRect();
    var leftGap = mainRect.left;
    var rightGap = document.documentElement.clientWidth - mainRect.right;
    check('desktop content centered (left ' + leftGap.toFixed(0) + ' / right ' + rightGap.toFixed(0) + ')',
      mobile || (leftGap > 8 && near(leftGap, rightGap, 3)));
    check('no horizontal overflow (' + document.documentElement.scrollWidth + ' vs ' +
      document.documentElement.clientWidth + ')',
      document.documentElement.scrollWidth <= document.documentElement.clientWidth);

    var oddBorders = [];
    mount.querySelectorAll('*').forEach(function (n) {
      if (n === results || n.classList.contains('divider') || n.classList.contains('mobile-bar') ||
          n.closest('.confirm-modal')) return;
      var cs = getComputedStyle(n);
      if (['borderTopWidth', 'borderRightWidth', 'borderBottomWidth'].some(function (k) {
        return parseFloat(cs[k]) > 0;
      }) || parseFloat(cs.borderLeftWidth) > 0) oddBorders.push(n.className || n.tagName);
    });
    check('no stray borders (found: ' + oddBorders.slice(0, 4).join('|') + ')', oddBorders.length === 0);

    // ================= v3: alignment =================
    var rv = redStat.querySelector('.stat-value').getBoundingClientRect();
    var tv = takenStat.querySelector('.stat-value').getBoundingClientRect();
    check('reduction and taken sit side by side (' + rv.right.toFixed(0) + ' < ' + tv.left.toFixed(0) + ')',
      rv.right <= tv.left);
    check('reduction and taken share a row (' + rv.top.toFixed(0) + ' vs ' + tv.top.toFixed(0) + ')',
      near(rv.top, tv.top, 2));

    var lineVals = results.querySelectorAll('.breakdown .line-value');
    check('three breakdown values', lineVals.length === 3);
    var vx = Array.prototype.map.call(lineVals, function (n) { return n.getBoundingClientRect().left; });
    check('breakdown values share x (' + vx.map(function (v) { return v.toFixed(0); }).join(',') + ')',
      near(vx[0], vx[1]) && near(vx[1], vx[2]));
    var lineLabels = results.querySelectorAll('.breakdown .line-label');
    check('breakdown labels are armor / prot / res',
      lineLabels[0].textContent.trim() === 'armor' &&
      lineLabels[1].textContent.trim() === 'prot' &&
      lineLabels[2].textContent.trim() === 'res');

    // control row baselines
    var protLabel = first.querySelector('.prot-label').getBoundingClientRect();
    var lvl0 = levels[0].getBoundingClientRect();
    var lvl5 = levels[5].getBoundingClientRect();
    var plusBtn = first.querySelector('.prot-inc').getBoundingClientRect();
    check('resistance 0 aligns with prot label (prot ' + protLabel.left.toFixed(0) +
      ' / level0 ' + lvl0.left.toFixed(0) + ')', near(protLabel.left, lvl0.left, 2));
    check('resistance 5 aligns with + button (plus ' + plusBtn.right.toFixed(0) +
      ' / level5 ' + lvl5.right.toFixed(0) + ')', near(plusBtn.right, lvl5.right, 2));

    var shield = resRow.querySelector('.res-icon').getBoundingClientRect();
    var triggerBox = first.querySelector('.slot-trigger').getBoundingClientRect();
    check('shield sized like armor icon (' + shield.height.toFixed(0) + ' vs ' + triggerBox.height.toFixed(0) + ')',
      near(shield.height, triggerBox.height, 2));

    var protInput = first.querySelector('.prot-input');
    protInput.value = '32767';
    protInput.dispatchEvent(new Event('input', { bubbles: true }));
    check('input fits 32767 (scroll ' + protInput.scrollWidth + ' <= client ' + protInput.clientWidth + ')',
      protInput.scrollWidth <= protInput.clientWidth);
    protInput.value = '0';
    protInput.dispatchEvent(new Event('input', { bubbles: true }));

    // ================= v3: popover placement + damage order =================
    first.querySelector('.slot-trigger').click();
    var popRect = pop.getBoundingClientRect();
    var trigRect = first.querySelector('.slot-trigger').getBoundingClientRect();
    var protRect = first.querySelector('.prot').getBoundingClientRect();
    check('popover sits to the right of the trigger (' + popRect.left.toFixed(0) +
      ' >= ' + trigRect.right.toFixed(0) + ')', popRect.left >= trigRect.right - 2);
    check('popover sits right of the trigger and reaches the prot column',
      popRect.left >= trigRect.right - 2 && popRect.left < protRect.right);

    var popPad = getComputedStyle(pop).paddingTop;
    check('popover padding tightened to 6px (' + popPad + ')', parseFloat(popPad) === 6);

    // ================= v5: prot gap, group width, popover layout =================
    var labelRect = first.querySelector('.prot-label').getBoundingClientRect();
    var decRect = first.querySelector('.prot-dec').getBoundingClientRect();
    var gapProt = decRect.left - labelRect.right;
    check('prot label to stepper gap <= 18px (' + gapProt.toFixed(0) + ')', gapProt <= 18);
    check('prot label to stepper gap >= 8px (' + gapProt.toFixed(0) + ')', gapProt >= 8);

    var groupWidth = parseFloat(getComputedStyle(first.querySelector('.prot')).width);
    var levelsWidth = parseFloat(getComputedStyle(resRow.querySelector('.res-levels')).width);
    check('prot group and resistance levels share width (' + groupWidth.toFixed(0) +
      ' vs ' + levelsWidth.toFixed(0) + ')', near(groupWidth, levelsWidth, 1));
    var trackWidth = first.querySelector('.durability').getBoundingClientRect().left -
      first.querySelector('.slot-trigger').getBoundingClientRect().right;
    check('prot group narrower than its track (' + groupWidth.toFixed(0) +
      ' < ' + trackWidth.toFixed(0) + ')', groupWidth < trackWidth - 20);

    if (mobile) {
      var colRect = mount.querySelector('.controls').getBoundingClientRect();
      var mLabel = first.querySelector('.prot-label').getBoundingClientRect();
      check('mobile prot group shifted right (label ' + mLabel.left.toFixed(0) +
        ' > column ' + colRect.left.toFixed(0) + ')', mLabel.left > colRect.left + 40);
      check('mobile prot group hugs right edge (' + mLabel.left.toFixed(0) + ' + ' +
        groupWidth.toFixed(0) + ')',
        near(mLabel.left + groupWidth, first.querySelector('.prot').getBoundingClientRect().right, 1));

      var optTops = Array.prototype.map.call(pop.querySelectorAll('.mat-option'),
        function (n) { return n.getBoundingClientRect().top; });
      var uniqTops = optTops.filter(function (v, i) { return optTops.indexOf(v) === i; });
      check('mobile popover lays out as two rows (' + uniqTops.length + ' distinct tops)',
        uniqTops.length === 2);
      var firstRowCount = optTops.filter(function (v) { return v === uniqTops[0]; }).length;
      check('mobile popover first row holds three options (' + firstRowCount + ')', firstRowCount === 3);
      var optLefts = Array.prototype.map.call(pop.querySelectorAll('.mat-option'),
        function (n) { return n.getBoundingClientRect().left; });
      var popLeft = pop.getBoundingClientRect().left;
      check('mobile popover first row starts at box left (' + optLefts[0].toFixed(0) +
        ' vs ' + popLeft.toFixed(0) + ')', near(optLefts[0], popLeft, 8));
      var trigTop = first.querySelector('.slot-trigger').getBoundingClientRect().top;
      check('mobile popover box top flush with trigger top (' + popRect.top.toFixed(0) +
        ' vs ' + trigTop.toFixed(0) + ')', near(popRect.top, trigTop, 1));
      check('mobile popover first row sits at box top + padding (' + uniqTops[0].toFixed(0) +
        ' vs ' + (popRect.top + 6).toFixed(0) + ')', near(uniqTops[0], popRect.top + 6, 1));
    } else {
      var dTops = Array.prototype.map.call(pop.querySelectorAll('.mat-option'),
        function (n) { return n.getBoundingClientRect().top; });
      var dUniq = dTops.filter(function (v, i) { return dTops.indexOf(v) === i; });
      check('desktop popover stays a single row (' + dUniq.length + ')', dUniq.length === 1);
      check('desktop popover height equals armor height (' + popRect.height.toFixed(0) +
        ' vs ' + trigRect.height.toFixed(0) + ')', near(popRect.height, trigRect.height, 1));
    }
    var rowH = first.getBoundingClientRect().height;
    pop.querySelector('.mat-option[data-material="none"]').click();
    check('row height unchanged by popover', near(first.getBoundingClientRect().height, rowH, 1));

    // boots edge case: last row keeps the 3x2 box, overflowing downward past the resistance row
    var bootRow = mount.querySelector('[data-slot="boots"]');
    bootRow.querySelector('.slot-trigger').click();
    var bootPop = bootRow.querySelector('.material-popover');
    var bootTops = Array.prototype.map.call(bootPop.querySelectorAll('.mat-option'),
      function (n) { return Math.round(n.getBoundingClientRect().top); });
    var bootUniq = bootTops.filter(function (v, i) { return bootTops.indexOf(v) === i; });
    check('boots popover keeps two rows on mobile / one on desktop (' + bootUniq.length + ')',
      bootUniq.length === (mobile ? 2 : 1));
    check('boots popover keeps six options',
      bootPop.querySelectorAll('.mat-option').length === 6);
    if (mobile) {
      check('boots popover clears the damage label by >= 20px (' +
        (damageRowEl.getBoundingClientRect().top - bootPop.getBoundingClientRect().bottom).toFixed(0) + ')',
        damageRowEl.getBoundingClientRect().top - bootPop.getBoundingClientRect().bottom >= 20);
    } else {
      check('desktop boots popover also fits armor height (' +
        bootPop.getBoundingClientRect().height.toFixed(0) + ')',
        near(bootPop.getBoundingClientRect().height, bootRow.querySelector('.slot-trigger')
          .getBoundingClientRect().height, 1));
    }
    bootPop.querySelector('.mat-option[data-material="none"]').click();

    var out = results.querySelector('.damage-out');
    var order = Array.prototype.map.call(out.children, function (n) { return n.className; });
    check('damage order: value -> heart value -> heart icon (' + order.join(' ') + ')',
      /damage-value/.test(order[0]) && /damage-equals/.test(order[1]) &&
      /heart-value/.test(order[2]) && /heart-icon/.test(order[3]));

    // ================= v4: palette, spacing, equals, persistence, reset =================
    check('prot label is enchanted purple',
      getComputedStyle(first.querySelector('.prot-label')).color === 'rgb(138, 92, 245)');
    check('durability is brighter green',
      getComputedStyle(first.querySelector('.durability')).color === 'rgb(95, 168, 99)');
    check('reduction value is green',
      getComputedStyle(redStat.querySelector('.stat-value')).color === 'rgb(47, 125, 58)');
    check('reduction label is dark green',
      getComputedStyle(redStat.querySelector('.stat-label')).color === 'rgb(26, 84, 36)');
    check('taken value is brighter red',
      getComputedStyle(takenStat.querySelector('.stat-value')).color === 'rgb(204, 68, 68)');
    check('taken label is dark red',
      getComputedStyle(takenStat.querySelector('.stat-label')).color === 'rgb(122, 32, 32)');

    var equals = results.querySelector('.damage-equals');
    check('equals sign between damage and hearts', !!equals && equals.textContent.trim() === '=');

    var gapLeft = results.getBoundingClientRect().left - mount.querySelector('.controls').getBoundingClientRect().right;
    check('results line up with the input column (' + gapLeft.toFixed(0) + ')', mobile || gapLeft <= 0);

    // transitions sped up
    var popTransition = getComputedStyle(pop).transitionDuration;
    check('popover transition <= 100ms (' + popTransition + ')',
      parseFloat(popTransition) <= 0.1);
    var confirmTransition = getComputedStyle(mount.querySelector('.confirm-modal')).transitionDuration;
    check('confirm modal transition <= 160ms (' + confirmTransition + ')',
      parseFloat(confirmTransition) <= 0.16);

    // reset control at the right end of the resistance row
    var resetBtn = resRow.querySelector('.reset-button');
    check('reset button exists with svg', !!resetBtn && !!resetBtn.querySelector('svg'));
    var resetRect = resetBtn.getBoundingClientRect();
    var levelsRect = levels[5].getBoundingClientRect();
    check('reset sits to the right of the levels', resetRect.left >= levelsRect.right - 2);

    // persistence: state survives a fresh mount
    ['helmet', 'chestplate'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="iron"]').click();
    });
    mount.querySelector('[data-slot="helmet"] .prot-input').value = '3';
    mount.querySelector('[data-slot="helmet"] .prot-input').dispatchEvent(new Event('input', { bubbles: true }));
    levels[2].click();

    var weapon2 = mount.querySelector('.weapon-input');
    var sharp2 = mount.querySelector('.sharp-input');
    var str2 = mount.querySelector('.strength-input');
    var weak2 = mount.querySelector('.weakness-input');
    weapon2.value = '6';
    weapon2.dispatchEvent(new Event('input', { bubbles: true }));
    sharp2.value = '3';
    sharp2.dispatchEvent(new Event('input', { bubbles: true }));
    str2.value = '2';
    str2.dispatchEvent(new Event('input', { bubbles: true }));
    weak2.value = '1';
    weak2.dispatchEvent(new Event('input', { bubbles: true }));
    mount.querySelector('.crit-input').click();
    mount.querySelectorAll('.mode')[1].click();
    var manual2 = mount.querySelector('.manual-input');
    manual2.value = '9.5';
    manual2.dispatchEvent(new Event('input', { bubbles: true }));

    var stored = window.localStorage.getItem('prot.state');
    check('state written to localStorage', !!stored && /iron/.test(stored) && /"resistance":2/.test(stored));

    var mount2 = document.createElement('main');
    document.body.appendChild(mount2);
    var app2 = ProtUI.mount(mount2);
    check('restored iron helmet', app2.state.slots.helmet.material === 'iron');
    check('restored prot 3', app2.state.slots.helmet.prot === 3);
    check('restored resistance 2', app2.state.resistance === 2);
    check('restored mode', app2.state.mode === 'mnl' &&
      mount2.querySelectorAll('.mode')[1].classList.contains('is-active'));
    check('restored attack inputs', app2.state.attack.weapon === '6' &&
      app2.state.attack.sharpness === 3 && app2.state.attack.strength === 2 &&
      app2.state.attack.weakness === 1 && app2.state.attack.crit === true);
    check('restored manual damage', app2.state.manual === '9.5' &&
      mount2.querySelector('.manual-input').value === '9.5');
    mount2.remove();

    // reset: confirm modal, then wipe state + storage
    resetBtn.click();
    var confirmModal = mount.querySelector('.confirm-modal');
    check('reset opens confirm modal', !!confirmModal && confirmModal.classList.contains('is-open'));
    confirmModal.querySelector('.reset-cancel').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('cancel keeps state', app.state.slots.helmet.material === 'iron' &&
      !confirmModal.classList.contains('is-open'));
    resetBtn.click();
    confirmModal.querySelector('.reset-confirm').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('confirm clears equipment', app.state.slots.helmet.material === 'none' &&
      app.state.slots.chestplate.material === 'none');
    check('confirm clears prot and resistance', app.state.slots.helmet.prot === 0 && app.state.resistance === 0);
    check('confirm clears attack inputs',
      app.state.attack.weapon === '' && app.state.attack.sharpness === 0 &&
      app.state.attack.strength === 0 && app.state.attack.weakness === 0 &&
      app.state.attack.crit === false && app.state.manual === '');
    check('confirm returns to ccl mode', app.state.mode === 'ccl' &&
      mount.querySelectorAll('.mode')[0].classList.contains('is-active'));
    var afterReset = window.localStorage.getItem('prot.state');
    check('reset leaves no legacy damage field', !!afterReset && afterReset.indexOf('"damage"') === -1);
    check('confirm clears storage (' + afterReset + ')',
      !!afterReset && !/iron/.test(afterReset) && /"prot":0/.test(afterReset) &&
      /"resistance":0/.test(afterReset));
    check('reset modal closed after confirm', !confirmModal.classList.contains('is-open'));

    // a pre-mode blob still loads: its damage becomes the manual value, mode stays ccl
    window.localStorage.setItem('prot.state', JSON.stringify({
      slots: { helmet: { material: 'iron', prot: 2 } }, resistance: 1, damage: '12'
    }));
    var mount4 = document.createElement('main');
    document.body.appendChild(mount4);
    var app4 = ProtUI.mount(mount4);
    check('legacy damage becomes the manual value', app4.state.manual === '12');
    check('legacy blob opens in ccl', app4.state.mode === 'ccl');
    check('legacy manual value reaches the input',
      mount4.querySelector('.manual-input').value === '12');
    check('legacy blob keeps its armor', app4.state.slots.helmet.material === 'iron' &&
      app4.state.slots.helmet.prot === 2);
    mount4.remove();

    // vertical compression
    var controlsGap = parseFloat(getComputedStyle(mount.querySelector('.controls')).rowGap);
    check('control rows tightly packed (' + controlsGap + 'px)',
      mobile ? controlsGap <= 26 : controlsGap <= 30);
    var resGap = parseFloat(getComputedStyle(resRow).marginTop) || controlsGap;
    check('resistance row separated from boots by a larger gap (' + resGap + ' vs ' + controlsGap + ')',
      resGap > controlsGap);
    if (mobile) {
      var mBar = mount.querySelector('.mobile-bar');
      check('mobile footer has a top divider', parseFloat(getComputedStyle(mBar).borderTopWidth) >= 2);
      check('mobile footer stays fixed', getComputedStyle(mBar).position === 'fixed');
      check('mobile footer sits at the viewport bottom (' + mBar.getBoundingClientRect().bottom.toFixed(0) +
        ' vs ' + document.documentElement.clientHeight + ')',
        near(mBar.getBoundingClientRect().bottom, document.documentElement.clientHeight, 2));
    }

    // narrow-viewport popover wraps rather than overflowing
    {
      var probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:0;top:0;width:300px';
      var clone = first.cloneNode(true);
      probe.appendChild(clone);
      document.body.appendChild(probe);
      var cpop = clone.querySelector('.material-popover');
      cpop.classList.add('is-open');
      check('popover wraps within narrow container',
        cpop.getBoundingClientRect().width <= 300);
      document.body.removeChild(probe);
    }
  } catch (e) {
    log('FAIL  exception: ' + e.message + '\n' + (e.stack || ''));
    failures++;
  }
  log(failures === 0 ? 'all green' : failures + ' failing');

  // headless runs read the verdict from the dom (chrome --dump-dom)
  var out = document.createElement('pre');
  out.id = 'uitest-out';
  out.hidden = true;
  out.textContent = lines.join('\n');
  document.body.appendChild(out);
  document.documentElement.setAttribute('data-uitest', failures === 0 ? 'green' : 'failing');
})();
</script>
</body>
</html>
