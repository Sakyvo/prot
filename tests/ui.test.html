<!doctype html>
<html>
<head><base href="../"><meta charset="utf-8"><title>ui-test</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  function log(s) { console.log('[uitest] ' + s); }
  var failures = 0;
  function check(name, cond) { if (!cond) failures++; log((cond ? 'pass' : 'FAIL') + '  ' + name); }
  var mobile = matchMedia('(max-width: 760px)').matches;
  log('mode: ' + (mobile ? 'mobile' : 'desktop') + ' (innerWidth ' + window.innerWidth + ')');

  try {
    var mount = document.createElement('div');
    document.body.appendChild(mount);
    var app = ProtUI.mount(mount);
    var state = app.state;

    // ---- 006: shell removal & skin ----
    check('no site header in page shell', !document.querySelector('.site-head'));
    check('no "protection" wording', mount.textContent.indexOf('protection') === -1);
    check('no "resistance" wording', mount.textContent.indexOf('resistance') === -1);
    check('body background is #d4e0ec',
      getComputedStyle(document.body).backgroundColor === 'rgb(212, 224, 236)');

    var rows = mount.querySelectorAll('.slot-row');
    check('four slot rows', rows.length === 4);
    check('row order helmet->boots',
      rows[0].dataset.slot === 'helmet' && rows[3].dataset.slot === 'boots');

    var bordered = ['.slot-row', '.results', '.breakdown', '.resistance-row', '.damage-row']
      .reduce(function (acc, sel) {
        mount.querySelectorAll(sel).forEach(function (n) {
          var cs = getComputedStyle(n);
          if (parseFloat(cs.borderTopWidth) > 0 || parseFloat(cs.borderLeftWidth) > 0) acc.push(sel);
        });
        return acc;
      }, []);
    check('zero borders on panels (found: ' + bordered.join(',') + ')', bordered.length === 0);

    var first = rows[0];
    check('trigger image uses empty slot for none',
      /assets\/textures\/empty_armor_slot_helmet\.png$/.test(first.querySelector('.slot-trigger img').src));
    check('durability shows 0 for none', first.querySelector('.durability').textContent.trim() === '0');
    check('prot label text is "prot"', first.querySelector('.prot-label').textContent.trim() === 'prot');
    check('no flat material button row', mount.querySelectorAll('.mats').length === 0);
    check('leather texture is tinted (non-grayscale)',
      first.querySelector('.slot-trigger') !== null); // texture check done by tools/tint + screenshot

    // ---- 007: material picker popover ----
    var pop = first.querySelector('.material-popover');
    check('popover exists and starts hidden', !!pop && !pop.classList.contains('is-open'));
    first.querySelector('.slot-trigger').click();
    check('trigger click opens popover', pop.classList.contains('is-open'));
    check('popover has 6 options', pop.querySelectorAll('.mat-option').length === 6);
    check('popover covers rather than expands row', getComputedStyle(pop).position === 'absolute');

    // outside click closes
    document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('outside click closes popover', !pop.classList.contains('is-open'));

    // pick diamond
    first.querySelector('.slot-trigger').click();
    pop.querySelector('.mat-option[data-material="diamond"]').click();
    check('pick diamond closes popover', !pop.classList.contains('is-open'));
    check('trigger image switched to diamond',
      /assets\/textures\/diamond_helmet\.png$/.test(first.querySelector('.slot-trigger img').src));
    check('durability 363 after diamond', first.querySelector('.durability').textContent.trim() === '363');
    check('state updated', state.slots.helmet.material === 'diamond');

    // back to none
    first.querySelector('.slot-trigger').click();
    pop.querySelector('.mat-option[data-material="none"]').click();
    check('durability back to 0 for none', first.querySelector('.durability').textContent.trim() === '0');

    // ---- 008: resistance levels ----
    var resRow = mount.querySelector('.resistance-row');
    var levels = resRow.querySelectorAll('.res-level');
    check('six resistance levels', levels.length === 6);
    check('shield icon present from assets',
      /assets\/textures\/effect_resistance\.png$/.test(resRow.querySelector('.res-icon').src));
    check('no stepper buttons', !resRow.querySelector('.res-inc') && !resRow.querySelector('.res-dec'));
    levels[3].click();
    check('clicking level 3 sets resistance 3', state.resistance === 3);
    check('level 3 marked active', levels[3].classList.contains('is-active'));
    levels[0].click();
    check('clicking level 0 clears it', state.resistance === 0 && !levels[3].classList.contains('is-active'));

    // ---- 009: results column (desktop) ----
    var results = mount.querySelector('.results');
    check('results area exists', !!results);
    var redStat = results.querySelector('.stat.reduction');
    var takenStat = results.querySelector('.stat.taken');
    check('reduction number then label inline',
      redStat.querySelector('.stat-value').textContent.trim() === '0.00%' &&
      redStat.querySelector('.stat-label').textContent.trim() === 'reduction');
    check('taken stat exists', takenStat.querySelector('.stat-label').textContent.trim() === 'taken');

    var lines = results.querySelectorAll('.breakdown .line');
    check('breakdown has three lines', lines.length === 3);
    check('breakdown empty config shows three 0.00%',
      Array.prototype.every.call(lines, function (l) { return /0\.00%/.test(l.textContent); }));
    check('breakdown labels are armor / prot / res',
      /^armor/.test(lines[0].textContent) && /prot/.test(lines[1].textContent) && /res/.test(lines[2].textContent));

    var dmg = results.querySelector('.damage-input');
    var dmgVal = results.querySelector('.damage-value');
    var heartVal = results.querySelector('.heart-value');
    check('damage output defaults to 0.00', dmgVal.textContent.trim() === '0.00');
    check('heart count defaults to 0.00', heartVal.textContent.trim() === '0.00');
    check('heart icon present',
      /assets\/textures\/heart\.png$/.test(results.querySelector('.heart-icon').src));

    // fill full diamond then check numbers
    ['helmet', 'chestplate', 'leggings', 'boots'].forEach(function (slot) {
      var row = mount.querySelector('[data-slot="' + slot + '"]');
      row.querySelector('.slot-trigger').click();
      row.querySelector('.mat-option[data-material="diamond"]').click();
    });
    check('full diamond reduction 80.00%',
      redStat.querySelector('.stat-value').textContent.trim() === '80.00%');
    check('breakdown armor line 80.00%', /80\.00%/.test(lines[0].textContent));

    dmg.value = '10';
    dmg.dispatchEvent(new Event('input', { bubbles: true }));
    check('damage 10 @ 80% -> 2.00', dmgVal.textContent.trim() === '2.00');
    check('2.00 damage -> 1.00 hearts', heartVal.textContent.trim() === '1.00');

    // prot control still steppers, capped badge still there
    var helmProt = mount.querySelector('[data-slot="helmet"] .prot-input');
    helmProt.value = '21';
    helmProt.dispatchEvent(new Event('input', { bubbles: true }));
    check('epf capped badge visible past 20', results.querySelector('.epf-capped').hidden === false);
    helmProt.value = '0';
    helmProt.dispatchEvent(new Event('input', { bubbles: true }));
    check('badge hidden again', results.querySelector('.epf-capped').hidden === true);

    // ---- 010: mobile modal vs desktop inline ----
    var modal = mount.querySelector('.detail-modal');
    check('detail modal exists', !!modal);
    check('modal has svg close button', !!modal.querySelector('svg.modal-close'));
    check('modal starts closed', !modal.classList.contains('is-open'));
    check('modal has three detail lines', modal.querySelectorAll('.line').length === 3);

    if (mobile) {
      check('breakdown hidden on mobile', getComputedStyle(results.querySelector('.breakdown')).display === 'none');
      redStat.querySelector('.stat-label').click();
      check('tapping label opens modal on mobile', modal.classList.contains('is-open'));
      modal.querySelector('svg.modal-close').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      check('svg close closes modal', !modal.classList.contains('is-open'));
      redStat.querySelector('.stat-label').click();
      modal.querySelector('.modal-backdrop').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      check('backdrop click closes modal', !modal.classList.contains('is-open'));
      check('footer bar is slim (only two stats)',
        mount.querySelector('.mobile-bar') === null || mount.querySelectorAll('.mobile-bar .stat').length <= 2);
    } else {
      check('breakdown visible on desktop', getComputedStyle(results.querySelector('.breakdown')).display !== 'none');
      redStat.querySelector('.stat-label').click();
      check('label click does not open modal on desktop', !modal.classList.contains('is-open'));
      check('footer stats laid out for mobile only',
        !mount.querySelector('.mobile-bar') || getComputedStyle(mount.querySelector('.mobile-bar')).display === 'none');
    }
  } catch (e) {
    log('FAIL  exception: ' + e.message + '\n' + (e.stack || ''));
    failures++;
  }
  log(failures === 0 ? 'all green' : failures + ' failing');
})();
</script>
</body>
</html>
